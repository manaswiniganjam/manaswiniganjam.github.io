<div class="pdf-wrapper">

  <div class="pdf-actions">
    <a href="{{ site.baseurl }}pdf/mg_resume_1.pdf" target="_blank" rel="noopener">
      Open PDF in a new tab
    </a>
  </div>

  <div id="pdf-container"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(async function () {
  const url = "{{ site.baseurl }}pdf/mg_resume_1.pdf";

  const pdfjsLib = window["pdfjs-dist/build/pdf"];
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const container = document.getElementById("pdf-container");
  const wrapper = document.querySelector("#resume .pdf-wrapper");

  // tweak this to change "zoom" feeling (smaller number = smaller text)
  const SCALE_TWEAK = 0.95;

  let pdfDoc = null;

  async function render() {
    if (!pdfDoc) return;

    container.innerHTML = "";

    // Column width (NOT full window width)
    const targetCssWidth = wrapper.clientWidth - 36; // subtract container padding

    const dpr = window.devicePixelRatio || 1;

    for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
      const page = await pdfDoc.getPage(pageNum);

      // Fit page to the column width
      const viewport1 = page.getViewport({ scale: 1 });
      const scale = (targetCssWidth / viewport1.width) * SCALE_TWEAK;
      const viewport = page.getViewport({ scale });

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      // CSS size
      canvas.style.width = Math.floor(viewport.width) + "px";
      canvas.style.height = Math.floor(viewport.height) + "px";

      // Actual pixel buffer for sharpness
      canvas.width = Math.floor(viewport.width * dpr);
      canvas.height = Math.floor(viewport.height * dpr);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      container.appendChild(canvas);

      await page.render({ canvasContext: ctx, viewport }).promise;
    }
  }

  pdfDoc = await pdfjsLib.getDocument(url).promise;
  await render();

  // Re-render on resize (debounced)
  let t;
  window.addEventListener("resize", () => {
    clearTimeout(t);
    t = setTimeout(render, 200);
  });
})();
</script>
              </div>
            </div>
        </div>
      </div>
    </div>
  </section>
