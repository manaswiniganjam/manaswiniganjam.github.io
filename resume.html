        adobeDCView.previewFile(
       {
          content:   {location: {url: "https://manaswiniganjam.github.io/pdf/mg_resume_general.pdf"}},
          metaData: {fileName: "mg_resume_general.pdf"}
       }, previewConfig);
    });
