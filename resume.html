<div class="pdf-wrapper">

    <a href="{{ site.baseurl }}pdf/mg_resume_1.pdf" target="_blank" rel="noopener">

  <div id="pdf-container"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(async function () {
  const url = "{{ site.baseurl }}pdf/mg_resume_1.pdf";

  const pdfjsLib = window["pdfjs-dist/build/pdf"];
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const container = document.getElementById("pdf-container");
  const wrapper = document.querySelector("#resume .pdf-wrapper");

  // tweak this to change "zoom" feeling (smaller number = smaller text)
  const SCALE_TWEAK = 0.95;

  let pdfDoc = null;

async function render() {
  if (!pdfDoc) return;

  container.innerHTML = "";

  const dpr = window.devicePixelRatio || 1;

  // Pick a comfortable scale; smaller = smaller text
  const BASE_SCALE = 1.2;

  // Extra oversampling for sharpness (2 is a good ceiling)
  const OVERSAMPLE = 2;

  for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
    const page = await pdfDoc.getPage(pageNum);

    const viewport = page.getViewport({ scale: BASE_SCALE });

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { alpha: false });

    // CSS size (display)
    canvas.style.width = Math.round(viewport.width) + "px";
    canvas.style.height = Math.round(viewport.height) + "px";

    // Real pixel buffer (render)
    const renderScale = dpr * OVERSAMPLE;
    canvas.width = Math.round(viewport.width * renderScale);
    canvas.height = Math.round(viewport.height * renderScale);

    // Map render pixels back to CSS pixels
    ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);

    container.appendChild(canvas);

    await page.render({
      canvasContext: ctx,
      viewport,
      intent: "display"
    }).promise;
  }
}

  pdfDoc = await pdfjsLib.getDocument(url).promise;
  await render();

  // Re-render on resize (debounced)
  let t;
  window.addEventListener("resize", () => {
    clearTimeout(t);
    t = setTimeout(render, 200);
  });
})();
</script>
              </div>
            </div>
        </div>
      </div>
    </div>
