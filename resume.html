---
layout: layout
title: resume
---
<!-- Google Analytics -->
{% include analytics.html %}

<div id="wrap">

  <section id="about">
    <div class="container">
      <div class="avatar">
        <a href="{{ site.baseurl}}/home.html">
          <img class="img-circle" src="{{ site.baseurl }}static/img/{{ site.avatar }}" alt="Responsive image" width="130" height="130">
        </a>
      </div>

      <h1><a href="{{ site.baseurl}}/home.html"><strong>{{ site.author }}</strong></a></h1>

      <div class="tagline">
        <h4>{{site.tagline}}</h4>
      </div>
    </div>
  </section>

  {% include header.html %}

  <section id="resume">
    <div class="containersize">
      <div class="test test-default">
        <div class="test-body">
          <div class="resume">

            <div class="frame"></div>
            <div class="pdf-wrapper">
              <div class="pdf-actions">
                <a href="https://manaswiniganjam.github.io/pdf/mg_resume_1.pdf" target="_blank" rel="noopener">
                  Open PDF in a new tab
                </a>
              </div>
              <iframe
                src="https://manaswiniganjam.github.io/pdf/mg_resume_1.pdf#view=FitV"
                title="Manaswini Ganjam - Resume"
                loading="lazy"
                class="resume-iframe">
                </iframe>
              </div>
            </div>
        </div>
      </div>
    </div>
  </section>

  {% include social.html %}

</div>
