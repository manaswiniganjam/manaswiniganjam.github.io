<div class="pdf-wrapper">

  <div class="pdf-actions">
    <a href="{{ site.baseurl }}pdf/mg_resume_1.pdf" target="_blank" rel="noopener">
      Open PDF in a new tab
    </a>
  </div>

  <div id="pdf-container"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  const url = "{{ site.baseurl }}pdf/mg_resume_1.pdf";
  const container = document.getElementById("pdf-container");

  const pdfjsLib = window["pdfjs-dist/build/pdf"];
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  let pdfDoc = null;

  // ↓ Make text look slightly smaller by reducing this number (try 0.90–0.98)
  const SCALE_TWEAK = 0.93;

  async function renderAllPages() {
    if (!pdfDoc) return;
    container.innerHTML = "";

    const containerWidth = container.clientWidth;

    for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
      const page = await pdfDoc.getPage(pageNum);

      // Fit-to-width scale
      const unscaled = page.getViewport({ scale: 1 });
      const scale = (containerWidth / unscaled.width) * SCALE_TWEAK;
      const viewport = page.getViewport({ scale });

      // Retina sharpness
      const dpr = window.devicePixelRatio || 1;

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.style.width = viewport.width + "px";
      canvas.style.height = viewport.height + "px";
      canvas.width = Math.floor(viewport.width * dpr);
      canvas.height = Math.floor(viewport.height * dpr);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      container.appendChild(canvas);

      await page.render({ canvasContext: ctx, viewport }).promise;
    }
  }

  pdfjsLib.getDocument(url).promise.then(async function (pdf) {
    pdfDoc = pdf;
    await renderAllPages();
  });

  // Re-render on resize so it stays consistent across screen sizes
  let t = null;
  window.addEventListener("resize", function () {
    clearTimeout(t);
    t = setTimeout(() => renderAllPages(), 200);
  });
})();
</script>
              </div>
            </div>
        </div>
      </div>
    </div>
  </section>
