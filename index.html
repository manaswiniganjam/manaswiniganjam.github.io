---
layout: layout
---

<!-- Google Analytics -->
{% include analytics.html %}

<!-- Redirect to home.html -->
<meta http-equiv="refresh" content="0; url={{ site.baseurl }}/home.html" />

<div id="wrap">
    <section id="about">
        <div class="container">
            <div class="avatar">
                <a href="{{ site.baseurl }}/home.html"> 
                    <img class="img-circle" src="{{ site.baseurl }}static/img/{{ site.avatar }}" alt="Responsive image" width="130" height="130">
                </a>
            </div>
            <h1>
                <a href="{{ site.baseurl }}/home.html"><strong> {{ site.author }} </strong></a>
            </h1>
            <div class="tagline">
                <h4>{{ site.tagline }}</h4>
            </div>
        </div>
    </section>

    {% include header.html %}
</div>
